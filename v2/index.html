<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; }

    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255,255,255,0.92);
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      font: 14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      max-width: min(420px, calc(100vw - 24px));
    }
    .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
    .row > label { min-width: 72px; color: #333; }
    input[type="text"], input[type="number"]{
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }
    input[type="number"] { width: 90px; }
    button {
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #f6f6f6; }
    .muted { color: #666; font-size: 12px; }
    .error { color: #b00020; font-size: 12px; }
    .ok { color: #0a7a2f; font-size: 12px; }
  </style>
</head>

<body>
<div id="map"></div>

<div class="panel">
  <div class="row">
    <strong>Tracker</strong>
    <span id="status" class="muted">idle</span>
  </div>

  <div class="row">
    <label for="deviceId">deviceId</label>
    <input id="deviceId" type="text" value="dev1" />
    <button id="btnApply">Apply</button>
  </div>

  <div class="row">
    <label for="limit">limit</label>
    <input id="limit" type="number" min="1" max="5000" value="500" />
    <label for="interval">sec</label>
    <input id="interval" type="number" min="5" max="3600" value="60" />
  </div>

  <div class="row">
    <button id="btnRefresh">Refresh</button>
    <button id="btnFit">Fit track</button>
    <label style="display:flex; align-items:center; gap:6px;">
      <input id="follow" type="checkbox" checked />
      Follow latest
    </label>
  </div>

  <div class="row muted">
    <span>Points: <span id="ptsCount">0</span></span>
    <span>Last update: <span id="lastUpdate">—</span></span>
  </div>

  <div id="err" class="error" style="display:none;"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---- helpers
  const $ = (id) => document.getElementById(id);

  const setStatus = (text, kind="muted") => {
    const el = $("status");
    el.className = kind;
    el.textContent = text;
  };

  const showError = (msg) => {
    const el = $("err");
    if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
    el.style.display = "block";
    el.textContent = msg;
  };

  // ---- read deviceId from URL (?deviceId=dev1)
  const url = new URL(window.location.href);
  const urlDevice = url.searchParams.get("deviceId");

  // ---- UI state
  let deviceId = urlDevice || "dev1";
  let timer = null;

  $("deviceId").value = deviceId;

  // ---- map (default view: Metro Vancouver)
  const DEFAULT_CENTER = [49.22, -123.00];
  const DEFAULT_ZOOM = 12;

  const map = L.map("map").setView(DEFAULT_CENTER, DEFAULT_ZOOM);
  map.attributionControl.setPrefix(false);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  // No placeholder marker: only create when we have real data
  let marker = null;

  const line = L.polyline([], { weight: 4 }).addTo(map);

  // Optional polish: auto-fit once when first real track arrives (>=2 points)
  let hasAutoFit = false;

  function fitToTrack() {
    const pts = line.getLatLngs();
    if (!pts || pts.length < 2) return;
    map.fitBounds(line.getBounds(), { padding: [20, 20] });
  }

  async function fetchTrack() {
    const limit = Math.max(1, Math.min(5000, Number($("limit").value) || 500));
    const qs = new URLSearchParams({ deviceId, limit: String(limit) });

    setStatus("fetching…", "muted");
    showError("");

    const r = await fetch(`/api/track?${qs.toString()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`);

    return r.json();
  }

  function clearMapData() {
    line.setLatLngs([]);
    if (marker) {
      map.removeLayer(marker);
      marker = null;
    }
    $("ptsCount").textContent = "0";
  }

  // ✅ Accept both formats:
  // - backend returns: [ {deviceId, lat, lon, ts}, ... ]
  // - older format: { points: [ {lat, lon}, ... ] }
  function normalizePoints(payload) {
    const arr = Array.isArray(payload)
      ? payload
      : (payload?.points || []);

    return arr
      .map(p => ({
        lat: Number(p?.lat),
        lon: Number(p?.lon),
        ts: p?.ts
      }))
      .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
  }

  function applyTrack(trackPayload) {
    const points = normalizePoints(trackPayload);
    const pts = points.map(p => [p.lat, p.lon]);

    $("ptsCount").textContent = String(pts.length);

    // If no data: show nothing on the map (keep default view)
    if (pts.length === 0) {
      clearMapData();
      setStatus("no data", "muted");
      return;
    }

    // Draw track
    line.setLatLngs(pts);

    // Auto-fit once when track first appears (and has a shape)
    if (!hasAutoFit && pts.length >= 2) {
      fitToTrack();
      hasAutoFit = true;
    }

    const last = pts[pts.length - 1];

    // Create marker on first real point
    if (!marker) {
      marker = L.marker(last).addTo(map).bindPopup("Latest position");
    } else {
      marker.setLatLng(last);
    }

    // Follow latest if enabled
    if ($("follow").checked) {
      map.panTo(last, { animate: true });
    }

    $("lastUpdate").textContent = new Date().toLocaleString();
    setStatus("ok", "ok");
  }

  async function refresh() {
    try {
      const track = await fetchTrack();
      applyTrack(track);
    } catch (e) {
      clearMapData();
      setStatus("error", "error");
      showError(String(e?.message || e));
    }
  }

  function restartTimer() {
    if (timer) clearInterval(timer);
    const sec = Math.max(5, Math.min(3600, Number($("interval").value) || 60));
    timer = setInterval(refresh, sec * 1000);
  }

  // ---- UI actions
  $("btnRefresh").addEventListener("click", refresh);
  $("btnFit").addEventListener("click", fitToTrack);

  $("btnApply").addEventListener("click", () => {
    deviceId = $("deviceId").value.trim() || "dev1";

    // update URL for shareable links
    const u = new URL(window.location.href);
    u.searchParams.set("deviceId", deviceId);
    window.history.replaceState({}, "", u.toString());

    // New device => allow auto-fit again when data arrives
    hasAutoFit = false;

    refresh();
  });

  $("interval").addEventListener("change", restartTimer);

  // ---- boot
  restartTimer();
  refresh();
</script>
</body>
</html>
